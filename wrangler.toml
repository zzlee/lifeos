name = "lifeos"
main = "worker/index.ts"
compatibility_date = "2026-03-27"
compatibility_flags = [ "global_fetch_strictly_public", "nodejs_compat" ]
assets = { directory = "./dist" }
workers_dev = true

[vars]
APP_NAME = "LifeOS"
VITE_API_BASE_URL = "https://lifeos-worker.zzlee-tw.workers.dev"
ALLOWED_ORIGINS = "https://lifeos-worker.zzlee-tw.workers.dev,http://localhost:5173,http://127.0.0.1:5173"

# Local development database binding.
[[d1_databases]]
binding = "DB"
database_name = "lifeos-db"
database_id = "local-dev"

# Production example:
# 1. Run `npx wrangler d1 create lifeos-db`
# 2. Replace the placeholder below with the returned database_id
# 3. Deploy with `npx wrangler deploy`
#
[env.production]
name = "lifeos-worker"

[env.production.vars]
APP_NAME = "LifeOS"
VITE_API_BASE_URL = "https://lifeos-worker.zzlee-tw.workers.dev"
ALLOWED_ORIGINS = "https://lifeos-worker.zzlee-tw.workers.dev,http://localhost:5173,http://127.0.0.1:5173"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lifeos-db"
database_id = "dd8cdb41-d79b-414f-9e86-648b57c05895"
