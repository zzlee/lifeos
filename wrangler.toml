name = "lifeos"
main = "worker/index.ts"
compatibility_date = "2026-03-27"
workers_dev = true

[vars]
APP_NAME = "LifeOS"

# Local development database binding.
[[d1_databases]]
binding = "DB"
database_name = "lifeos-db"
database_id = "local-dev"

# Production example:
# 1. Run `npx wrangler d1 create lifeos-db`
# 2. Replace the placeholder below with the returned database_id
# 3. Deploy with `npx wrangler deploy`
#
[env.production]
name = "lifeos-worker"

[env.production.vars]
APP_NAME = "LifeOS"

[[env.production.d1_databases]]
binding = "DB"
database_name = "lifeos-db"
database_id = "dd8cdb41-d79b-414f-9e86-648b57c05895"
