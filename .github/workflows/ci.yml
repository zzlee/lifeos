name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check worker types
      run: npm run check:worker

    - name: Run unit tests
      run: npx tsx --test tests/*.test.ts

    - name: Install Playwright Browsers
      run: npx playwright install chromium

    - name: Run E2E tests
      run: |
        npm run dev &
        sleep 2
        npx playwright test
